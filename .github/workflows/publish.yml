# MANUAL ONLY -- the book is built and published from a workstation.
#
# WHY. The chapters and slide decks now need energyRt, a solver (Julia/HiGHS or
# GLPK) and the converted PyPSA-Eur datasets. This runner has none of them, so a
# CI build would render the prose without any of the numbers and then overwrite a
# good local publish with it. The push trigger is deliberately removed; the job is
# kept for the rare case where a prose-only rebuild is genuinely wanted.
#
# To publish, from the repo root:
#
#   quarto render slides/real-model.qmd          # 1. decks, locally (they solve)
#   quarto render slides/pypsa-replication.qmd
#   quarto publish gh-pages                      # 2. builds and pushes the book
#
on:
  workflow_dispatch:

name: Publish to GitHub Pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            knitr
            rmarkdown

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
